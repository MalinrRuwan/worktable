[workspace]
members = [
  "crates/worktable-ai",
  "crates/worktable-app",
  "crates/worktable-db",
  "crates/worktable-events",
  "crates/worktable-helix",
  "crates/worktable-ui",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# GPUI (Zed) and the GPUI Component library. `gpui-component` declares its Zed
# dependencies without a revision, so we do the same here — Cargo then resolves
# every Zed dependency to a single commit, which the committed Cargo.lock pins
# for reproducibility. Pinning a workspace `rev` here would instead produce two
# incompatible `gpui` crates in the same graph.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c0bebdc8a8cf9a74f9f52feaca278a52a9cfcca2" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c0bebdc8a8cf9a74f9f52feaca278a52a9cfcca2" }

# Debug builds are what developers run every day: optimize every dependency
# (GPUI's layout/render path in particular) while keeping the workspace crates
# unoptimized for fast, debuggable iteration. This is the same split Zed uses
# so the debug app renders smoothly instead of dropping frames.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

# Keep shipped binaries small without affecting debug iteration speed.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
