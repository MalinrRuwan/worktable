[package]
name = "worktable-ai"
version = "0.1.0"
edition = "2024"

[dependencies]

pi_agent_rust = "0.1.23"
asupersync = "0.3.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
worktable-db = { path = "../worktable-db" }
worktable-events = { path = "../worktable-events" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
worktable-helix = { path = "../worktable-helix" }
