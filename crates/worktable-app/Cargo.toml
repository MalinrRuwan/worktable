[package]
name = "worktable-app"
version = "1.2.0"
edition = "2024"
# `cargo run -p worktable-app` is the documented developer loop; the package
# also ships the feature-gated visual-test runner.
default-run = "worktable-app"

[features]
# Enables GPUI's test-support (and gpui_macos'/gpui_apple's) so the visual-test
# binary can use `VisualTestAppContext` — real macOS Metal rendering with
# off-screen windows and `render_to_image` captures.
visual-tests = ["gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "worktable_visual_test"
path = "src/bin/worktable_visual_test.rs"
required-features = ["visual-tests"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
worktable-ai = { path = "../worktable-ai" }
worktable-db = { path = "../worktable-db" }
worktable-events = { path = "../worktable-events" }
worktable-ui = { path = "../worktable-ui" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Saving captured RgbaImages as PNG baselines (visual-test binary).
image = "0.25"

[dev-dependencies]
# GPUI's test-support feature exposes TestAppContext / VisualTestContext /
# VisualTestAppContext (real macOS rendering) that the interaction + visual
# tests in `worktable_view_tests.rs` rely on.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
worktable-helix = { path = "../worktable-helix" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSMenu",
  "NSMenuItem",
  "NSView",
  "NSWindow",
  "NSResponder",
  "NSEvent",
  "NSPasteboard",
  "NSImage",
  "NSStatusItem",
  "NSStatusBar",
  "NSApplication",
  "NSRunningApplication",
  "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
block2 = { version = "0.6", features = ["alloc"] }
objc2-core-graphics = { version = "0.3", features = [
  "CGEvent",
  "CGEventTypes",
  "CGRemoteOperation",
] }
