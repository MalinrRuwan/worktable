[package]
name = "worktable-web"
version = "0.1.0"
edition = "2024"
description = "Worktable WebGPU/WASM + WebView target"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "worktable-webview"
path = "src/bin/webview.rs"
required-features = ["webview"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlStyleElement",
  "Element",
  "Node",
  "Storage",
  "console",
  "Request",
  "Response",
  "Headers",
  "Event",
  "CustomEvent",
  "CssStyleDeclaration",
  "DomTokenList",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "CanvasRenderingContext2d",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "Clipboard",
  "Performance",
] }
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"
wgpu = { version = "26", features = ["webgpu", "wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
worktable-events = { path = "../worktable-events" }
worktable-db = { path = "../worktable-db" }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# WebView (native desktop wrapper around the web build)
wry = { version = "0.53", optional = true }
tao = { version = "0.34", optional = true }

[features]
default = []
webview = ["dep:wry", "dep:tao"]

# WASM release is size-optimized
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
